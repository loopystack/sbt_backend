services:
  # Frontend Service (React + Vite)
  - type: web
    name: sportsbetting-frontend
    env: node
    region: oregon
    buildCommand: cd soccer_frontend && npm install && npm run build
    startCommand: cd soccer_frontend && npm run preview -- --host 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_VERSION
        value: 18.17.0

  # Backend Service (FastAPI)
  - type: web
    name: sportsbetting-backend
    env: python
    region: oregon
    buildCommand: cd soccer_backend && pip install -r requirements.txt
    startCommand: cd soccer_backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

